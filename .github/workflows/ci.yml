name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: Example servers must report what the README says
        shell: bash
        working-directory: examples
        run: |
          set +e
          mcpprobe --no-color -- python servers/weather_dual.py
          clean=$?
          mcpprobe --no-color -t 2 --config mcp.json
          mixed=$?
          echo "clean=$clean mixed=$mixed"
          test "$clean" -eq 0 && test "$mixed" -eq 1
